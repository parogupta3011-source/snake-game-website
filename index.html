<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <div>
        <p class="eyebrow">ARCADE</p>
        <h1>Snake Game</h1>
      </div>

      <div class="score-board">
        <div>
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>High Score</span>
          <strong id="highScore">0</strong>
        </div>
      </div>
    </header>

    <section class="game-card">
      <canvas id="gameCanvas" width="500" height="500"></canvas>

      <div id="gameOverlay" class="game-overlay">
        <h2 id="overlayTitle">Snake</h2>
        <p id="overlayMessage">Press Start Game to begin</p>
        <button id="startButton">Start Game</button>
      </div>
    </section>

    <section class="controls">
      <button class="control-btn" data-direction="up">▲</button>

      <div>
        <button class="control-btn" data-direction="left">◀</button>
        <button class="control-btn" data-direction="down">▼</button>
        <button class="control-btn" data-direction="right">▶</button>
      </div>
    </section>

    <p class="instructions">
      Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move.
    </p>
  </main>

  <script src="script.js"></script>
</body>
  </html>
